<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PH Photo Resizer</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: Arial, sans-serif; background: #f4f6f8;
    color: #222; display: flex; justify-content: center; padding: 30px 15px;
  }
  .card {
    width: min(700px, 100%); background: white; border-radius: 16px;
    padding: 28px; box-shadow: 0 5px 25px rgba(0,0,0,.08);
  }
  h1 { margin-top: 0; }
  .sub { color: #666; }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; margin: 20px 0; }
  button, select, input[type=file] {
    font: inherit; padding: 11px 14px; border: 1px solid #ccc;
    border-radius: 9px; background: white;
  }
  button { cursor: pointer; background: #222; color: white; border: 0; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  canvas {
    display: block; max-width: 100%; max-height: 500px; margin: 20px auto;
    background: #eee; border-radius: 8px;
  }
  .note { font-size: 14px; color: #666; }
  #status { min-height: 22px; margin-top: 10px; }
</style>
</head>
<body>
<div class="card">
  <h1>📸 PH Photo Resizer</h1>
  <p class="sub">Simple photo resizing tool — runs entirely in your browser.</p>

  <div class="controls">
    <input id="file" type="file" accept="image/*">
    <select id="size">
      <option value="2x2">2 × 2 inches</option>
      <option value="1x1">1 × 1 inch</option>
      <option value="35x45">35 × 45 mm</option>
      <option value="45x35">45 × 35 mm</option>
    </select>
  </div>

  <canvas id="canvas" width="600" height="600"></canvas>

  <div class="controls">
    <button id="download" disabled>Download Photo</button>
  </div>

  <p id="status" class="note">Choose a photo to begin.</p>
  <p class="note">Note: This is a basic tool. Always check the current requirements of the organization you're applying to.</p>
</div>

<script>
const fileInput = document.getElementById('file');
const sizeSelect = document.getElementById('size');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const downloadBtn = document.getElementById('download');
const status = document.getElementById('status');

let image = null;

const sizes = {
  "2x2": [2, 2],
  "1x1": [1, 1],
  "35x45": [35, 45],
  "45x35": [45, 35]
};

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = e => {
    image = new Image();
    image.onload = () => {
      drawPreview();
      downloadBtn.disabled = false;
      status.textContent = "Photo loaded. Choose a size, then download.";
    };
    image.src = e.target.result;
  };
  reader.readAsDataURL(file);
});

sizeSelect.addEventListener('change', drawPreview);

function drawPreview() {
  if (!image) return;

  const [w, h] = sizes[sizeSelect.value];
  const ratio = w / h;

  let cw = 600, ch = Math.round(cw / ratio);
  if (ch > 600) {
    ch = 600;
    cw = Math.round(ch * ratio);
  }

  canvas.width = cw;
  canvas.height = ch;

  // Center-crop the original image to the selected aspect ratio.
  const sourceRatio = image.width / image.height;
  let sx = 0, sy = 0, sw = image.width, sh = image.height;

  if (sourceRatio > ratio) {
    sw = image.height * ratio;
    sx = (image.width - sw) / 2;
  } else {
    sh = image.width / ratio;
    sy = (image.height - sh) / 2;
  }

  ctx.clearRect(0, 0, cw, ch);
  ctx.drawImage(image, sx, sy, sw, sh, 0, 0, cw, ch);
}

downloadBtn.addEventListener('click', () => {
  if (!image) return;

  const [w, h] = sizes[sizeSelect.value];

  // 300 DPI output dimensions.
  const mmPerInch = 25.4;
  let widthIn, heightIn;

  if (sizeSelect.value.includes("x")) {
    if (sizeSelect.value === "35x45") {
      widthIn = 35 / mmPerInch; heightIn = 45 / mmPerInch;
    } else if (sizeSelect.value === "45x35") {
      widthIn = 45 / mmPerInch; heightIn = 35 / mmPerInch;
    } else {
      widthIn = w; heightIn = h;
    }
  }

  const outW = Math.round(widthIn * 300);
  const outH = Math.round(heightIn * 300);
  const out = document.createElement('canvas');
  out.width = outW; out.height = outH;
  const octx = out.getContext('2d');

  const ratio = outW / outH;
  const sourceRatio = image.width / image.height;
  let sx = 0, sy = 0, sw = image.width, sh = image.height;

  if (sourceRatio > ratio) {
    sw = image.height * ratio;
    sx = (image.width - sw) / 2;
  } else {
    sh = image.width / ratio;
    sy = (image.height - sh) / 2;
  }

  octx.drawImage(image, sx, sy, sw, sh, 0, 0, outW, outH);

  const link = document.createElement('a');
  link.download = `photo-${sizeSelect.value}.jpg`;
  link.href = out.toDataURL('image/jpeg', 0.95);
  link.click();

  status.textContent = "Downloaded!";
});
</script>
</body>
</html>
